---
layout: default
---
<article class="pillar-page blog-post">

  <header class="pillar-hero post-hero">
    <div class="pillar-wrap">
      <a href="{{ '/blog/' | relative_url }}" class="back-to-blog">&larr; All Posts</a>
      <h1>{{ page.title }}</h1>
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
    </div>
  </header>

  <div class="pillar-wrap blog-body">
    <div class="blog-column">
      <div class="post-content pillar-content">
        {{ content }}
      </div>

      <footer class="post-footer">
        <a href="{{ '/blog/' | relative_url }}" class="back-to-blog">&larr; All Posts</a>
      </footer>
    </div>
  </div>

</article>
