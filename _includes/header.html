<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="" width="40" height="40">
      <span>HydeMind</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <span class="hamburger"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/llms-for-revops/' | relative_url }}" class="nav-link{% if page.url == '/llms-for-revops/' %} active{% endif %}"{% if page.url == '/llms-for-revops/' %} aria-current="page"{% endif %}>LLMs for RevOps</a>
      <a href="{{ '/learning-path/' | relative_url }}" class="nav-link{% if page.url == '/learning-path/' %} active{% endif %}"{% if page.url == '/learning-path/' %} aria-current="page"{% endif %}>Learning Path</a>
      <div class="nav-dropdown">
        <button class="nav-link dropdown-toggle" aria-expanded="false">
          Ops Disciplines <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="dropdown-menu">
          <a href="{{ '/sales-operations/' | relative_url }}" class="dropdown-item{% if page.url == '/sales-operations/' %} active{% endif %}">Sales Ops</a>
          <a href="{{ '/marketing-operations/' | relative_url }}" class="dropdown-item{% if page.url == '/marketing-operations/' %} active{% endif %}">Marketing Ops</a>
          <a href="{{ '/cs-operations/' | relative_url }}" class="dropdown-item{% if page.url == '/cs-operations/' %} active{% endif %}">CS Ops</a>
        </div>
      </div>
      <div class="nav-dropdown">
        <button class="nav-link dropdown-toggle" aria-expanded="false">
          Pillars <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="dropdown-menu">
          <a href="{{ '/data/' | relative_url }}" class="dropdown-item{% if page.url == '/data/' %} active{% endif %}">Data</a>
          <a href="{{ '/customer-processes/' | relative_url }}" class="dropdown-item{% if page.url == '/customer-processes/' %} active{% endif %}">Customer Processes</a>
          <a href="{{ '/kpi-reporting/' | relative_url }}" class="dropdown-item{% if page.url == '/kpi-reporting/' %} active{% endif %}">KPIs &amp; Reporting</a>
          <a href="{{ '/tech-stack/' | relative_url }}" class="dropdown-item{% if page.url == '/tech-stack/' %} active{% endif %}">Tech Stack</a>
          <a href="{{ '/enablement/' | relative_url }}" class="dropdown-item{% if page.url == '/enablement/' %} active{% endif %}">Enablement</a>
          <a href="{{ '/strategic-insights/' | relative_url }}" class="dropdown-item{% if page.url == '/strategic-insights/' %} active{% endif %}">Strategic Insights &amp; Planning</a>
        </div>
      </div>
      <a href="{{ '/learning-path/' | relative_url }}" class="btn btn-ink nav-cta">Start learning</a>
    </nav>
  </div>
</header>
